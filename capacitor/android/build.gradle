// Top-level build file where you can add configuration options common to all sub-projects/modules.

// 国内直连 google() / mavenCentral() 常常只有几十 KB/s，加阿里云镜像优先命中。
// 镜像缺件时 Gradle 会自动回落到后面的官方源，所以顺序是「镜像在前、官方兜底」。
//
// 注意：这里不能在 buildscript {} 里引用 build.gradle 顶部的 def 变量。
// 那个 repositories {} 是委托闭包，属性查找会落到 RepositoryHandler 上，
// 访问外部变量会报「Could not get unknown property」。必须字面量写死。

buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
