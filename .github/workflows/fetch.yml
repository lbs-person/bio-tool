name: Fetch Wiki Images

on:
  workflow_dispatch:
    inputs:
      count:
        description: '本次最多处理多少张（建议 3000-5000）'
        required: false
        default: '3000'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas requests pillow tqdm

      - name: Fetch images
        env:
          COUNT: ${{ github.event.inputs.count }}
        run: |
          python scripts/fetch_images.py --count $COUNT

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "fetch images: ${COUNT}"
          git push